# ---------------------------------------------------------------------------
# recon configuration sample
#
# Copy this file to `config.ini` (in recon/data/) to run recon standalone.
# At deploy time ReconService.download_repo() injects the [Scan] values for
# you, so the deployed config.ini is assembled automatically -- this sample is
# for local/standalone runs and doubles as the reference for every section and
# option recon validates at startup (see IotRecon._validate_config).
# ---------------------------------------------------------------------------

[Masscan]
# masscan scan rate in packets per second. Higher is faster but noisier and
# more likely to drop results on a congested link.
rate = 1000

[Scan]
# IP address(es) to reconnoiter, as a Python-literal list of strings.
ip_addresses = ["192.0.2.10"]
# Ports to crawl for an HTTP API even if masscan/nmap don't flag them as http.
# Empty list = only crawl ports detected as http / ssl-http.
crawl_ports = [80, 443]
# Ports to exclude from the scan entirely (also excluded from crawling).
excl_ports = []

[Utils]
# Endpoints used by get_own_ip to discover the host's public IP. The first to
# respond wins; list more than one for resilience.
api_list = ["https://api.seeip.org/", "https://api.ipify.org/"]

# [Ssh] is OPTIONAL and only enables DEEP SSH reconnaissance. When recon finds an
# SSH service it always records the banner; if -- and only if -- credentials are
# given here it additionally logs in and harvests a persona of the real device
# (system info, /etc/passwd & friends, directory listings, ps/ifconfig/netstat...)
# so the SSH pot can clone it. Every harvested command is strictly read-only.
# Omit this whole section to keep SSH recon banner-only. _validate_config never
# requires it.
# [Ssh]
# enabled = true
# username = root
# password = root
# key_file = /home/pro/data/id_rsa   ; optional, alternative to password
# timeout = 15
